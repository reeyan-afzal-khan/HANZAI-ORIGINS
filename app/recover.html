<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refresh HANZAI-ORIGINS</title>
<style>body{margin:48px auto;padding:0 24px;max-width:560px;font:16px/1.6 system-ui;background:#1d2021;color:#ebdbb2}button,a{color:inherit}button{padding:12px 18px;background:#fabd2f;color:#1d2021;border:0;border-radius:8px;cursor:pointer}</style>
<h1>Refresh the app</h1>
<p>Replace outdated app files with the latest version. Your profiles, books, and learning progress stay on this device.</p>
<button id="refresh">Refresh app files</button>
<p id="status" role="status"></p>
<script>
document.getElementById('refresh').onclick = async function(){
  this.disabled = true;
  const status = document.getElementById('status');
  status.textContent = 'Refreshing app files…';
  try {
    const root = new URL('./', location.href);
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r => r.scope === root.href).map(r => r.unregister()));
    }
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.filter(n => n.startsWith('hskker-')).map(n => caches.delete(n)));
    }
    location.replace(new URL('index.html?refresh=' + Date.now(), root).href);
  } catch (e) {
    status.textContent = 'Could not refresh: ' + e.message + '. Please try again.';
    this.disabled = false;
  }
};
</script>
</html>
