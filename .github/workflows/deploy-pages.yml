# Builds the web app in app/ and deploys it to GitHub Pages:
# https://reeyan-afzal-khan.github.io/HANZAI-ORIGINS/
#
# There is no Jekyll step. The app is plain static files, and Jekyll would only
# copy them (and, run over the repository root, it turned README.md into the
# home page). The build is Node with no npm install, since the scripts it runs
# use only Node's own modules:
#   1. The offline translator ("Compact" in the reader) is not in the repository.
#      scripts/build-translation.mjs fetches it from its pinned sources, checks
#      each file against its SHA-256 and packs it into app/data/mt/. The
#      downloads are cached between runs.
#   2. scripts/build.mjs --pages: app/ -> release/pages/, with the service
#      worker stamped (see scripts/build.mjs).
name: Deploy HANZAI-ORIGINS to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the offline translator
        uses: actions/cache@v4
        with:
          path: |
            data/translation/runtime
            data/translation/opus-mt-zh-en
          key: translation-${{ hashFiles('data/translation/files.json') }}
      - name: Install the offline translator
        run: node scripts/build-translation.mjs
      - name: Build the site
        run: node scripts/build.mjs --pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/pages

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
